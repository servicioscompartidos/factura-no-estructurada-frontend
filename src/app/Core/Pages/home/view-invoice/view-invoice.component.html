<span style="font-size: 14px; font-weight: bold; padding-bottom: 0;" mat-dialog-title>Vista de la Factura</span>
<mat-dialog-content>
    <div class="contentInvoice">
        <img [src]="imagen" alt="Imagen de la factura">
    </div>
</mat-dialog-content>
<mat-dialog-actions style="padding-top: 0; padding-bottom: 0;">
  <button class="btnClosePreview" mat-dialog-close>Cerrar</button>
</mat-dialog-actions>
